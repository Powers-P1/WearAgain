name = "wearagain-api"
main = "src/index.js"
compatibility_date = "2026-10-21"

[vars]
VERSION = "0.3.0-youcam-ledger"
ALLOWED_ORIGINS = "https://wearagain.pages.dev"
# Enable only after allocating an explicit remaining provider budget.
LIVE_ENABLED = "false"
LIVE_TOTAL_UNITS = "0"
LIVE_DAILY_UNITS = "0"
LIVE_SESSION_DAILY_UNITS = "0"
DEMO_ASSET_ORIGIN = "https://wearagain.pages.dev"

[[durable_objects.bindings]]
name = "UNIT_LEDGER"
class_name = "UnitLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UnitLedger"]
